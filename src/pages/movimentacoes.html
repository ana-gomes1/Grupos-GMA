<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iGrupos - Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1769D1',
                        sidebar: '#102A4C',
                        background: '#F5F9FD'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-background text-slate-800">

    <div class="flex min-h-screen">

        <aside class="w-[275px] bg-sidebar text-white flex flex-col">

            <div class="h-[90px] flex items-center px-7">
                <i class="fa-solid fa-users text-3xl mr-4"></i>

                <span class="text-2xl font-semibold">
                    iGrupos
                </span>
            </div>

            <nav class="px-4 space-y-2">

                <a href="dashboard.html"
                   class="flex items-center gap-4 px-5 py-4 rounded-lg
                          hover:bg-white/10 text-white font-medium nav-item">

                    <i class="fa-solid fa-house text-lg"></i>

                    <span>Início</span>
                </a>

                <a href="grupos.html"
                   class="flex items-center gap-4 px-5 py-4 rounded-lg
                          hover:bg-white/10 transition nav-item">

                    <i class="fa-solid fa-user-group text-lg"></i>

                    <span>Grupos</span>
                </a>

                <a href="integrantes.html"
                   class="flex items-center gap-4 px-5 py-4 rounded-lg
                          hover:bg-white/10 transition nav-item">

                    <i class="fa-solid fa-users text-lg"></i>

                    <span>Integrantes</span>
                </a>

                <a href="movimentacoes.html"
                   class="flex items-center gap-4 px-5 py-4 rounded-lg
                          hover:bg-white/10 transition nav-item">

                    <i class="fa-regular fa-clipboard text-lg"></i>

                    <span>Movimentações</span>
                </a>

                <a href="config.html"
                   class="flex items-center gap-4 px-5 py-4 rounded-lg
                          hover:bg-white/10 transition nav-item">

                    <i class="fa-solid fa-gear text-lg"></i>

                    <span>Configurações</span>
                </a>

            </nav>

            <div class="mt-auto px-7 pb-7">

                <p class="text-sm text-slate-300 mb-4">
                    Conectado com
                </p>

                <div class="space-y-4">

                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-table-cells-large
                                  text-green-400 text-xl"></i>

                        <span>Google Planilhas</span>
                    </div>

                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-file-lines
                                  text-purple-400 text-xl"></i>

                        <span>Google Forms</span>
                    </div>

                </div>
            </div>

        </aside>


        <main class="flex-1">

            <header
                class="h-[72px] bg-white border-b border-slate-200
                       flex items-center justify-end px-8">


                <button
                    id="notificationButton"
                    class="relative w-10 h-10 rounded-full
                        flex items-center justify-center
                        text-slate-500 hover:bg-slate-100
                        hover:text-slate-700 transition mr-6">

                    <i class="fa-regular fa-bell text-xl"></i>

                    <!-- Indicador de notificações -->
                    <span
                        id="notificationBadge"
                        class="absolute top-1 right-1
                            w-2.5 h-2.5
                            bg-red-500 rounded-full
                            border-2 border-white">
                    </span>

                </button>       

                <div
                    class="w-10 h-10 rounded-full bg-blue-500
                           text-white flex items-center justify-center
                           font-semibold">

                    AV
                </div>

            </header>


            <section class="p-8">

                <div class="mb-7">

                    <h1 class="text-3xl font-bold text-slate-900">
                        Movimentações
                    </h1>

                </div>


                

            </section>

        </main>

    </div>
<script src="../script.js"></script>
</body>
</html>
